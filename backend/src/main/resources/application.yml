server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html,text/css,application/javascript
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

spring:
  application:
    name: smart-cart
  datasource:
    # Either a full JDBC URL, or the parts (Render's Blueprint supplies host/port/name separately).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartcart}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      request-timeout: -1
  mail:
    # Local: Mailpit (docker compose) on mailpit:1025, no auth.
    # Gmail: smtp.gmail.com:587, MAIL_SMTP_AUTH=true, MAIL_SMTP_STARTTLS=true, MAIL_PASSWORD=<app password>.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

management:
  health:
    # Email is best-effort; an SMTP outage must not mark the API itself as down.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # Must be at least 32 bytes (256 bits) for HS256. Override in every real environment.
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-0123456789}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MIN:10}
    general-per-minute: ${RATE_LIMIT_GENERAL_PER_MIN:300}
  shipping:
    free-above: 499
    fee: 49
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-email: ${ADMIN_EMAIL:admin@smartcart.local}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
  invoices:
    # Where the INVOICE background job writes invoice-<orderId>.html.
    dir: ${INVOICE_DIR:invoices}
  mail:
    # Off unless an SMTP server is configured; sending never blocks or fails a request.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@smartcart.local}
    from-name: ${MAIL_FROM_NAME:Smart Cart}
  payments:
    # Real payments only. A gateway without credentials is reported as unavailable and
    # checkout with it is refused (HTTP 503) - there is no simulated/fake payment path.
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
    phonepe:
      client-id: ${PHONEPE_CLIENT_ID:}
      client-secret: ${PHONEPE_CLIENT_SECRET:}
      client-version: ${PHONEPE_CLIENT_VERSION:1}
      # SANDBOX or PRODUCTION
      environment: ${PHONEPE_ENV:SANDBOX}
      webhook-username: ${PHONEPE_WEBHOOK_USERNAME:}
      webhook-password: ${PHONEPE_WEBHOOK_PASSWORD:}

logging:
  level:
    root: INFO
    com.smartcart: ${LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

---
spring:
  config:
    activate:
      on-profile: prod
app:
  jwt:
    cookie-secure: true
  seed:
    enabled: ${SEED_ENABLED:false}
logging:
  level:
    com.smartcart: WARN
