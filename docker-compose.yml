# Smart Cart local stack:  cp .env.example .env  &&  docker compose up --build
# Frontend http://localhost:3000 · API http://localhost:8100/api · Swagger http://localhost:8100/swagger-ui.html
# Email inbox (Mailpit) http://localhost:8025
name: smart-cart

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartcart
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d smartcart"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/smartcart
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Defaults deliver to Mailpit; set MAIL_HOST etc. in .env to use a real SMTP server.
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      INVOICE_DIR: /app/invoices
    # Invoices written by the background INVOICE job show up in backend/invoices on the host.
    volumes:
      - ./backend/invoices:/app/invoices
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8100}:8080"

  # Catches every email the backend sends. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8100}/api}
    environment:
      API_INTERNAL_URL: http://backend:8080/api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
