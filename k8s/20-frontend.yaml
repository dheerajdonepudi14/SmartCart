apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smart-cart
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          # Build with --build-arg NEXT_PUBLIC_API_URL=https://api.smartcart.example/api
          image: ghcr.io/your-org/smart-cart/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: API_INTERNAL_URL
              value: http://backend.smart-cart.svc.cluster.local:8080/api
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: smart-cart
spec:
  selector: { app: frontend }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: smart-cart
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
